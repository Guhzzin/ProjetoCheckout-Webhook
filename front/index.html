<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuStore — Loja Fictícia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .produto-img {
            height: 220px;
            object-fit: cover;
        }
        .card {
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="http://localhost:8090">
                <i class="bi bi-cpu text-primary me-2"></i>GuStore
            </a>
            <button class="btn btn-outline-primary position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCarrinho">
                <i class="bi bi-cart3 me-1"></i> Carrinho
                <span id="contador-carrinho" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                    0
                </span>
            </button>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container my-5">
        <div id="alerta-status"></div>

        <h1 class="text-center mb-4">Nossos Produtos</h1>
        <div class="row justify-content-center g-4" id="vitrine">
            <!-- Cards inseridos via JS -->
        </div>
    </div>

    <!-- Carrinho Lateral (Offcanvas) -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrinho">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title"><i class="bi bi-cart3 me-2"></i>Seu Carrinho</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="lista-carrinho" class="flex-grow-1">
                <p class="text-muted text-center mt-4">Seu carrinho está vazio.</p>
            </div>

            <div class="border-top pt-3 mt-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fs-5">Total:</span>
                    <strong class="fs-4 text-success" id="total-carrinho">R$ 0,00</strong>
                </div>
                <button id="btn-finalizar" class="btn btn-success w-100 py-2 fw-semibold" onclick="finalizarCompra()" disabled>
                    <i class="bi bi-credit-card me-2"></i>Finalizar Compra
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:3005';
        let catalogo = [];
        let carrinho = [];

        function formatarMoeda(valor) {
            return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function verificarRetornoPagamento() {
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status');
            const alerta = document.getElementById('alerta-status');

            if (status === 'sucesso') {
                alerta.innerHTML = `<div class="alert alert-success alert-dismissible fade show"><strong>Pagamento aprovado!</strong> Seu pedido foi confirmado.<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
            } else if (status === 'pendente') {
                alerta.innerHTML = `<div class="alert alert-warning alert-dismissible fade show"><strong>Pagamento pendente.</strong> Aguardando confirmação.<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
            } else if (status === 'erro') {
                alerta.innerHTML = `<div class="alert alert-danger alert-dismissible fade show"><strong>Pagamento não concluído.</strong> Tente novamente.<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
            }
        }

        async function carregarProdutos() {
            try {
                const resposta = await fetch(`${API_URL}/produtos`);
                catalogo = await resposta.json();

                const vitrine = document.getElementById('vitrine');
                vitrine.innerHTML = '';

                catalogo.forEach(produto => {
                    vitrine.innerHTML += `
                        <div class="col-md-4">
                            <div class="card h-100 shadow-sm overflow-hidden">
                                <img src="${produto.imagem_url}" class="card-img-top produto-img" alt="${produto.nome}">
                                <div class="card-body d-flex flex-column text-center">
                                    <h5 class="card-title">${produto.nome}</h5>
                                    <h4 class="card-text text-success my-3">${formatarMoeda(produto.preco)}</h4>
                                    <button class="btn btn-primary mt-auto" onclick="adicionarAoCarrinho(${produto.id})">
                                        <i class="bi bi-cart-plus me-1"></i> Adicionar ao Carrinho
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Erro na requisição:', error);
                document.getElementById('vitrine').innerHTML = '<p class="text-danger text-center">Erro ao carregar a vitrine.</p>';
            }
        }

        function adicionarAoCarrinho(produtoId) {
            const produto = catalogo.find(p => p.id === produtoId);
            if (!produto) return;

            const itemExistente = carrinho.find(item => item.produtoId === produtoId);
            if (itemExistente) {
                itemExistente.quantidade += 1;
            } else {
                carrinho.push({
                    produtoId: produto.id,
                    nome: produto.nome,
                    preco: Number(produto.preco),
                    imagem_url: produto.imagem_url,
                    quantidade: 1
                });
            }

            atualizarCarrinhoUI();
        }

        function alterarQuantidade(produtoId, delta) {
            const item = carrinho.find(i => i.produtoId === produtoId);
            if (!item) return;

            item.quantidade += delta;
            if (item.quantidade <= 0) {
                carrinho = carrinho.filter(i => i.produtoId !== produtoId);
            }
            atualizarCarrinhoUI();
        }

        function atualizarCarrinhoUI() {
            const lista = document.getElementById('lista-carrinho');
            const contador = document.getElementById('contador-carrinho');
            const totalEl = document.getElementById('total-carrinho');
            const btnFinalizar = document.getElementById('btn-finalizar');

            const totalItens = carrinho.reduce((acc, item) => acc + item.quantidade, 0);
            const totalValor = carrinho.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);

            contador.textContent = totalItens;
            totalEl.textContent = formatarMoeda(totalValor);
            btnFinalizar.disabled = carrinho.length === 0;

            if (carrinho.length === 0) {
                lista.innerHTML = '<p class="text-muted text-center mt-4">Seu carrinho está vazio.</p>';
                return;
            }

            lista.innerHTML = carrinho.map(item => `
                <div class="d-flex align-items-center gap-3 border-bottom py-3">
                    <img src="${item.imagem_url}" alt="${item.nome}" class="rounded" style="width: 56px; height: 56px; object-fit: cover;">
                    <div class="flex-grow-1">
                        <div class="fw-semibold small">${item.nome}</div>
                        <div class="text-success small">${formatarMoeda(item.preco)}</div>
                    </div>
                    <div class="d-flex align-items-center gap-1">
                        <button class="btn btn-sm btn-outline-secondary" onclick="alterarQuantidade(${item.produtoId}, -1)">-</button>
                        <span class="px-2">${item.quantidade}</span>
                        <button class="btn btn-sm btn-outline-secondary" onclick="alterarQuantidade(${item.produtoId}, 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        async function finalizarCompra() {
            const btn = document.getElementById('btn-finalizar');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Redirecionando...';

            try {
                const payload = {
                    itens: carrinho.map(item => ({
                        produtoId: item.produtoId,
                        quantidade: item.quantidade
                    }))
                };

                const resposta = await fetch(`${API_URL}/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const dados = await resposta.json();

                if (dados.init_point) {
                    window.location.href = dados.init_point;
                } else {
                    alert('Erro ao gerar link de pagamento.');
                    console.error(dados);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-credit-card me-2"></i>Finalizar Compra';
                }
            } catch (error) {
                console.error('Erro no checkout:', error);
                alert('Falha na comunicação com o servidor.');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-credit-card me-2"></i>Finalizar Compra';
            }
        }

        verificarRetornoPagamento();
        carregarProdutos();
    </script>
</body>
</html>
