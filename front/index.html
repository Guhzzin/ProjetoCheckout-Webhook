<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Fictícia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-5">Nossos Produtos</h1>
        
        <div class="row justify-content-center" id="vitrine">
            <!-- Os cards de produto serão inseridos aqui pelo JavaScript -->
        </div>
    </div>

    <script>
        // Apontando para a porta 3005
        const API_URL = 'http://localhost:3005';

        async function carregarProdutos() {
            try {
                const resposta = await fetch(`${API_URL}/produtos`);
                const produtos = await resposta.json();
                
                const vitrine = document.getElementById('vitrine');
                vitrine.innerHTML = '';

                produtos.forEach(produto => {
                    const card = `
                        <div class="col-md-4 mb-4">
                            <div class="card h-100 shadow-sm">
                                <img src="${produto.imagem_url}" class="card-img-top" alt="${produto.nome}">
                                <div class="card-body d-flex flex-column text-center">
                                    <h5 class="card-title">${produto.nome}</h5>
                                    <h3 class="card-text text-success my-3">R$ ${produto.preco}</h3>
                                    <button class="btn btn-primary mt-auto" onclick="iniciarCheckout(${produto.id})">Comprar</button>
                                </div>
                            </div>
                        </div>
                    `;
                    vitrine.innerHTML += card;
                });
            } catch (error) {
                console.error('Erro na requisição:', error);
                document.getElementById('vitrine').innerHTML = '<p class="text-danger text-center">Erro ao carregar a vitrine.</p>';
            }
        }

        async function iniciarCheckout(produtoId) {
            try {
                const resposta = await fetch(`${API_URL}/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ produtoId })
                });

                const dados = await resposta.json();

                if (dados.init_point) {
                    // Redireciona para o ambiente de testes do Mercado Pago
                    window.location.href = dados.init_point;
                } else {
                    alert('Erro ao gerar link de pagamento. Veja o console.');
                    console.error(dados);
                }
            } catch (error) {
                console.error('Erro no checkout:', error);
                alert('Falha na comunicação com o servidor.');
            }
        }
            carregarProdutos();
    </script>
</body>
</html>
